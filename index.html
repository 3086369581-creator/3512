<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私有网站 · 安全空间</title>
    <style>
        /* 基础重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #eef2ff;
            line-height: 1.5;
        }

        /* 主卡片——私有网站的容器 */
        .private-site {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 26, 40, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            padding: 2.5rem;
            transition: all 0.2s ease;
        }

        /* 页面头部 */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.5rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .lock-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px #4f9eff55);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff, #a5c9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            background: rgba(79, 158, 255, 0.15);
            border: 1px solid rgba(79, 158, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #a5c9ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4f9eff;
            box-shadow: 0 0 12px #4f9eff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 登录界面 —— 私有区域入口 */
        .login-panel {
            max-width: 460px;
            margin: 2rem auto 3rem;
            background: rgba(10, 16, 28, 0.7);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: transform 0.25s ease;
        }

        .login-panel:hover {
            border-color: rgba(79, 158, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .login-header p {
            color: #8a9bb5;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #9aabca;
            margin-bottom: 0.6rem;
        }

        .input-group input {
            width: 100%;
            background: #0d1422;
            border: 1px solid #232e44;
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            color: #f0f4ff;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #4f9eff;
            box-shadow: 0 0 0 3px rgba(79, 158, 255, 0.2);
            background: #0a101f;
        }

        .input-group input::placeholder {
            color: #4a5b74;
            font-weight: 300;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.5rem 0 1.8rem;
            font-size: 0.9rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #a0b1cc;
            cursor: pointer;
        }

        .remember input {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: #4f9eff;
            background: #0d1422;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-link {
            color: #4f9eff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #80b5ff;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #2b5fd9, #1a3d8c);
            border: none;
            border-radius: 1rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px -6px #1a3d8c;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #376be6, #1f4799);
            box-shadow: 0 12px 28px -8px #2b5fd9;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 16px -6px #1a3d8c;
        }

        /* 私有内容区域 —— 登录成功后才显示 (默认隐藏) */
        .private-content {
            display: none;
            animation: fadeSlide 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .welcome-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(79, 158, 255, 0.08);
            border: 1px solid rgba(79, 158, 255, 0.2);
            border-radius: 1.5rem;
            padding: 1rem 1.8rem;
        }

        .welcome-text {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .welcome-text span {
            font-size: 1.4rem;
        }

        .welcome-text h3 {
            font-weight: 500;
            font-size: 1.2rem;
            color: #d6e5ff;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #364a66;
            border-radius: 100px;
            padding: 0.5rem 1.4rem;
            color: #b4c7e5;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #5c7a9e;
            color: white;
        }

        /* 私有卡片网格 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0 1rem;
        }

        .private-card {
            background: rgba(18, 27, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.8rem;
            padding: 1.8rem 1.5rem;
            transition: all 0.25s;
        }

        .private-card:hover {
            border-color: rgba(79, 158, 255, 0.3);
            background: rgba(22, 34, 56, 0.8);
            transform: scale(1.01);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .private-card h4 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #e0ebff;
        }

        .private-card p {
            color: #8599b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .private-note {
            margin-top: 2.5rem;
            text-align: center;
            color: #506280;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.8rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .private-note span {
            background: rgba(255, 255, 255, 0.02);
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
        }

        /* 工具类 */
        .hidden {
            display: none !important;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .private-site {
                padding: 1.5rem;
                border-radius: 2rem;
            }

            .site-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .logo-text {
                font-size: 1.5rem;
            }

            .login-panel {
                padding: 1.8rem 1.2rem;
            }

            .welcome-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 1.2rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="private-site" role="main">
        <!-- 头部区域 -->
        <header class="site-header">
            <div class="logo-area">
                <span class="lock-icon" aria-hidden="true">🔒</span>
                <span class="logo-text">Privé</span>
            </div>
            <div class="badge">
                <span class="badge-dot"></span>
                私有实例 · 端到端保护
            </div>
        </header>

        <!-- 登录面板 (初始可见) -->
        <div id="loginPanel" class="login-panel">
            <div class="login-header">
                <h2>受限访问</h2>
                <p>请输入凭证以查看私有内容</p>
            </div>

            <form id="loginForm" onsubmit="return false;">
                <div class="input-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="例如：admin" autocomplete="username" value="admin">
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" value="private123">
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" checked> 记住我
                    </label>
                    <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('演示模式：请联系管理员重置凭证。')">忘记密码？</a>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span>🔓</span> 解锁私有网站
                </button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #4e627c;">
                演示凭证：admin / private123
            </p>
        </div>

        <!-- 私有内容区域 (初始隐藏) -->
        <div id="privateContent" class="private-content">
            <div class="welcome-bar">
                <div class="welcome-text">
                    <span>🗝️</span>
                    <h3>欢迎回来，<span id="displayUsername">admin</span></h3>
                </div>
                <button id="logoutBtn" class="logout-btn">
                    <span>🚪</span> 退出登录
                </button>
            </div>

            <div class="dashboard-grid">
                <div class="private-card">
                    <div class="card-icon">📁</div>
                    <h4>机密文档</h4>
                    <p>访问内部项目文件、合同和财务记录。所有数据已加密存储。</p>
                </div>
                <div class="private-card">
                    <div class="card-icon">👥</div>
                    <h4>团队管理</h4>
                    <p>管理成员权限、邀请新用户并查看审计日志。</p>
                </div>
                <div class="private-card">
                    <div class="card-icon">⚙️</div>
                    <h4>系统设置</h4>
                    <p>配置安全策略、双因素认证与API密钥。</p>
                </div>
                <div class="private-card">
                    <div class="card-icon">📊</div>
                    <h4>数据仪表盘</h4>
                    <p>实时监控私有站点活动与访问统计。</p>
                </div>
            </div>

            <div class="private-note">
                <span>🔐 此页面仅对授权用户可见</span>
                <span>🛡️ 会话受保护</span>
                <span>⏱️ 自动登出已启用</span>
            </div>
        </div>
    </main>

    <script>
        (function() {
            // DOM 元素
            const loginPanel = document.getElementById('loginPanel');
            const privateContent = document.getElementById('privateContent');
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const displayUsername = document.getElementById('displayUsername');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // 预定义私有凭证 (演示用，实际应用请使用后端验证)
            const VALID_USERNAME = 'admin';
            const VALID_PASSWORD = 'private123';

            // 切换界面：显示私有内容，隐藏登录面板
            function showPrivateContent(username) {
                loginPanel.classList.add('hidden');
                privateContent.style.display = 'block';
                // 显示用户名 (安全转义)
                displayUsername.textContent = username || '访客';

                // 可选：将会话标记存储到 sessionStorage，以便在刷新后保持登录？
                // 但为了演示简单，我们不在页面刷新后保持，不过可以加个小功能：用 sessionStorage 保持登录状态 (体验更好)
                // 下面采用 sessionStorage 来模拟会话保持 (仍然不安全，仅演示)
                try {
                    sessionStorage.setItem('privateDemoLoggedIn', 'true');
                    sessionStorage.setItem('privateDemoUsername', username || 'admin');
                } catch (e) {
                    // 如果浏览器禁用 sessionStorage，静默忽略
                }
            }

            // 退出登录：隐藏私有内容，显示登录面板，清除会话
            function logout() {
                privateContent.style.display = 'none';
                loginPanel.classList.remove('hidden');

                // 清除 sessionStorage
                try {
                    sessionStorage.removeItem('privateDemoLoggedIn');
                    sessionStorage.removeItem('privateDemoUsername');
                } catch (e) {}

                // 可选重置输入框 (保留用户名方便再次登录)
                // 但为了安全感觉，不清空也行，这里将密码清空更符合习惯
                passwordInput.value = ''; 
                // 用户名保留 (admin) 也行，或者置空
                // usernameInput.value = '';
                // 但为了演示方便，保留原来的值
                // 但若用户手动修改过，则保留他们的输入，这样更自然
                // 可以设置焦点到密码框
                passwordInput.focus();
            }

            // 登录逻辑
            function handleLogin(event) {
                if (event) event.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value; // 密码不需要trim

                // 简单的非空检查
                if (!username || !password) {
                    alert('请输入用户名和密码。');
                    return;
                }

                // 验证凭证 (演示硬编码)
                if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                    // 登录成功
                    showPrivateContent(username);
                } else {
                    alert('凭证无效。请使用演示账户：admin / private123');
                    // 清空密码框并聚焦
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            // 页面加载时检查是否已登录 (通过 sessionStorage)
            function checkSession() {
                try {
                    const isLoggedIn = sessionStorage.getItem('privateDemoLoggedIn') === 'true';
                    const storedUsername = sessionStorage.getItem('privateDemoUsername') || 'admin';

                    if (isLoggedIn) {
                        // 自动显示私有内容
                        loginPanel.classList.add('hidden');
                        privateContent.style.display = 'block';
                        displayUsername.textContent = storedUsername;
                    } else {
                        // 确保私有内容隐藏，登录面板可见
                        privateContent.style.display = 'none';
                        loginPanel.classList.remove('hidden');
                    }
                } catch (e) {
                    // 如果 sessionStorage 不可用，默认显示登录界面
                    privateContent.style.display = 'none';
                    loginPanel.classList.remove('hidden');
                }
            }

            // 设置事件监听
            function init() {
                // 登录按钮点击 / 表单提交
                loginForm.addEventListener('submit', handleLogin);
                // 也监听登录按钮点击 (但已由submit覆盖，防止重复触发可取消)
                // 不过submit已经覆盖，不用额外加

                // 退出按钮
                logoutBtn.addEventListener('click', logout);

                // 可选：在用户名输入框按回车时，默认提交表单
                // 但表单本身已经支持回车提交，不需额外处理

                // 启动时检查会话状态
                checkSession();

                // 若登录面板可见，自动聚焦到用户名或密码框 (取决于填写情况)
                if (!loginPanel.classList.contains('hidden')) {
                    // 如果用户名已经预填了admin，那么聚焦到密码框更友好
                    if (usernameInput.value.trim() === 'admin') {
                        passwordInput.focus();
                    } else {
                        usernameInput.focus();
                    }
                }
            }

            // 页面加载完成后初始化
            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>

    <!-- 额外的说明（隐藏注释）: 这是一个纯前端私有网站演示，真实私有网站必须使用后端验证和HTTPS -->
</body>
</html>
